repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-ast
      - id: check-json
        types: [text]
        files: \.(json|ipynb)$
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor
        args: ["--offline"]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff
        name: ruff lint (.py)
        args: [--fix, --show-fixes]
        types_or: [python]
      - id: ruff
        name: ruff isort (.ipynb)
        args: [--select, I, --fix]
        types_or: [jupyter]
      - id: ruff-format
        types_or: [python, jupyter]
  - repo: https://github.com/rbubley/mirrors-prettier # Update mirror as official mirror is deprecated
    rev: v3.9.6
    hooks:
      - id: prettier

  # Ruff doesn't have full coverage of pydoclint https://github.com/astral-sh/ruff/issues/12434
  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        name: pydoclint
        files: "none"
        # files: parcels/fieldset.py # put here instead of in config file due to https://github.com/pre-commit/pre-commit-hooks/issues/112#issuecomment-215613842
        args:
          - --select=DOC103 # TODO: Expand coverage to other codes
        additional_dependencies:
          - pydoclint[flake8]
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-format
        args:
          [
            "--option",
            "array_auto_collapse=false",
            "--option",
            "align_comments=false",
          ]
